[project]
name = "pep723fy"
dynamic = ["version"]
description = "Inject pyproject.toml/requirements.txt dependencies into PEP 723 inline script metadata"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
pep723fy = "pep723fy.cli:app"

[project.urls]
Repository = "https://github.com/ninoseki/pep723fy"
Homepage = "https://github.com/ninoseki/pep723fy/"
Issues = "https://github.com/ninoseki/pep723fy/issues/"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.hooks.version]
path = "src/pep723fy/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.targets.wheel]
packages = ["src/pep723fy"]

[dependency-groups]
dev = [
  "mypy>=1.20.2",
  "pytest-pretty>=1.3.0",
  "pytest-randomly>=4.1.0",
  "pytest>=9.0.3",
  "ruff>=0.15.12",
  "uv-sort>=0.7.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff.lint]
select = [
  "B",   # flake8-bugbear
  "C",   # flake8-comprehensions
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "FA",  # flake8-future-annotations
  "I",   # isort
  "N",   # pep8-naming
  "RET", # flake8-return
  "RUF", # Ruff-specific rules
  "SIM", # flake8-simplify
  "T20", # flake8-print
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "E501", # line too long
]

[tool.mypy]
ignore_missing_imports = true
